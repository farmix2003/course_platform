spring:
  application:
    name: backend


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:20030825}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
jwt:
  # Base64URL-encoded 256-bit key. Override JWT_SECRET outside local development.
  secret: ${JWT_SECRET:ZGV2ZWxvcG1lbnQtb25seS1qd3Qtc2VjcmV0LWtleS0zMmI}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:3600000}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED}
    token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}